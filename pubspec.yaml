name: arrow_puzzle
description: Arrows - a minimalist arrow line puzzle game. Faithful remake of the Unity original, rebuilt with a juicy, animated UI.
publish_to: "none"
version: 3.5.5+356

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: 6.4.0
  shared_preferences: 2.3.2
  # v5.0 monetisation
  google_mobile_ads: ^5.3.1
  in_app_purchase: 3.2.0
  in_app_purchase_android: ^0.3.6+13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/levels.json
    - assets/audio/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
